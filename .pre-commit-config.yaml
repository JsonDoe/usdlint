# Install once with `uv run pre-commit install`; run on demand with
# `uv run pre-commit run --all-files`. Keep the ruff and mypy revisions
# in sync with the dev dependency group in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      # Same invocation as CI (`mypy src`) with the configuration from
      # pyproject.toml; replaces the hook's default global
      # --ignore-missing-imports, which would hide real import errors.
      - id: mypy
        args: [src]
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
        types_or: [python, pyi, toml]
