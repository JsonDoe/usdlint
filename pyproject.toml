[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "usdguard"
dynamic = ["version"]
description = "Pluggable, DCC-agnostic validation framework for USD stages."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "JulienM" }]
keywords = [
    "usd",
    "openusd",
    "pxr",
    "validation",
    "lint",
    "pipeline",
    "vfx",
    "animation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["usd-core"]

[project.urls]
Homepage = "https://github.com/JsonDoe/usdlint"
Source = "https://github.com/JsonDoe/usdlint"
Issues = "https://github.com/JsonDoe/usdlint/issues"
Changelog = "https://github.com/JsonDoe/usdlint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.10",
]

[tool.hatch.version]
path = "src/usdguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/usdguard"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/CHANGELOG.md", "/README.md"]

[tool.uv]
# Rebuild the editable install when the single-sourced version changes,
# so that importlib.metadata agrees with usdguard.__version__.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/usdguard/__init__.py" },
]

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["usdguard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]
