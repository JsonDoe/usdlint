[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "usdguard"
dynamic = ["version"]
description = "Pluggable, DCC-agnostic validation framework for USD stages."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "JulienM" }]
keywords = [
    "usd",
    "openusd",
    "pxr",
    "validation",
    "lint",
    "pipeline",
    "vfx",
    "animation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# 25.11 is the oldest usd-core whose UsdValidation framework runs cleanly:
# earlier releases crash while registering UsdShade connectable behaviors
# and lack the gprim encapsulation validator. CI tests this floor.
dependencies = ["usd-core>=25.11", "tomli>=1.1; python_version < '3.11'"]

[project.scripts]
usdguard = "usdguard.cli:main"

[project.entry-points."usdguard.checks"]
"naming.prim_name" = "usdguard.checks.naming:PrimNameCheck"
"stage.metadata" = "usdguard.checks.stage:StageMetadataCheck"
"deps.absolute_arc_path" = "usdguard.checks.deps:AbsoluteArcPathCheck"
"deps.absolute_asset_attr" = "usdguard.checks.deps:AbsoluteAssetAttrCheck"
"deps.unresolved" = "usdguard.checks.deps:UnresolvedDependencyCheck"
"shading.material_binding" = "usdguard.checks.shading:MaterialBindingCheck"
"model.hierarchy" = "usdguard.checks.model:ModelHierarchyCheck"
"geom.primvar_size" = "usdguard.checks.geom:PrimvarSizeCheck"
"geom.extent" = "usdguard.checks.geom:ExtentCheck"
"compliance.usdchecker" = "usdguard.checks.compliance:UsdCheckerCheck"

[project.urls]
Homepage = "https://github.com/JsonDoe/usdlint"
Source = "https://github.com/JsonDoe/usdlint"
Issues = "https://github.com/JsonDoe/usdlint/issues"
Changelog = "https://github.com/JsonDoe/usdlint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.10",
]

[tool.hatch.version]
path = "src/usdguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/usdguard"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/CHANGELOG.md", "/README.md"]

[tool.uv]
# Rebuild the editable install when the single-sourced version changes,
# so that importlib.metadata agrees with usdguard.__version__.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/usdguard/__init__.py" },
]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PERF", # perflint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "G",    # flake8-logging-format
    "LOG",  # flake8-logging
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "ERA",  # eradicate (commented-out code)
    "RUF",  # ruff-specific rules
]
ignore = [
    "D105", # magic methods are self-explanatory
    "D107", # Google style documents __init__ arguments on the class
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Two non-goals of the project, enforced at lint time: usdguard stays
# DCC-agnostic and never touches the network at runtime.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"maya".msg = "usdguard is DCC-agnostic; do not import Maya modules."
"pymel".msg = "usdguard is DCC-agnostic; do not import Maya modules."
"hou".msg = "usdguard is DCC-agnostic; do not import Houdini modules."
"socket".msg = "usdguard must not access the network."
"http.client".msg = "usdguard must not access the network."
"urllib.request".msg = "usdguard must not access the network."
"requests".msg = "usdguard must not access the network."
"httpx".msg = "usdguard must not access the network."

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
# usd-core ships neither stubs nor a py.typed marker, and the
# third-party types-usd stubs (USD 24.05) reject idiomatic calls such
# as Prim.IsA(UsdGeom.Mesh) and lack pxr.UsdValidation.
module = ["pxr", "pxr.*"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["usdguard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "if __name__ == .__main__.:",
]
