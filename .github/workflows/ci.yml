name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Type-check
        run: uv run --no-sync mypy src
      - name: Test with coverage gate
        run: uv run --no-sync pytest

  ui:
    name: UI (${{ matrix.os }}, ${{ matrix.binding }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            binding: PySide6
          - os: windows-latest
            python-version: "3.12"
            binding: PySide6
          # PySide2 wheels stop at Python 3.10; pytest-qt 4.4 is the last
          # release that supports it.
          - os: ubuntu-latest
            python-version: "3.10"
            binding: PySide2
    env:
      QT_QPA_PLATFORM: offscreen
      QT_PREFERRED_BINDING: ${{ matrix.binding }}
      PYTEST_QT_API: ${{ matrix.binding == 'PySide2' && 'pyside2' || 'pyside6' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0t64
      - name: Install usdguard with PySide6
        if: matrix.binding == 'PySide6'
        run: uv sync --locked --extra ui --group ui
      - name: Install usdguard with PySide2
        if: matrix.binding == 'PySide2'
        run: |
          uv sync --locked --group ui
          uv pip install "Qt.py>=2.0" "PySide2==5.15.2.1" "pytest-qt==4.4.0"
      - name: Type-check against the Qt stubs
        if: matrix.binding == 'PySide6'
        run: uv run --no-sync mypy src
      - name: UI tests
        run: uv run --no-sync pytest -m ui --no-cov

  plugin:
    name: Example plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install usdguard and the example plugin
        run: |
          uv sync --locked
          uv pip install ./examples/custom_check_plugin
      - name: Check that the plugin is discovered
        run: uv run --no-sync usdguard list-checks | grep -F example.no_empty_groups
      - name: Test the plugin
        run: uv run --no-sync pytest examples/custom_check_plugin

  minimum-usd:
    name: Test (oldest supported usd-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies with the oldest supported usd-core
        # Keep in sync with the usd-core floor in pyproject.toml.
        run: |
          uv sync --locked
          uv pip install "usd-core==25.11"
      - name: Test
        run: uv run --no-sync pytest
